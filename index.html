    <style>

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Consolas, monospace;
        }


        body {
            background: #000;
            color: #00ff41;
            overflow-x: hidden;
            text-align: center;
        }


        /* ============================= */
        /* MATRIX CANVAS */
        /* ============================= */

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -2;
        }


        /* ============================= */
        /* LOADER */
        /* ============================= */

        #loader {
            position: fixed;
            width: 100%;
            height: 100vh;

            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            z-index: 999;

            color: #00ff41;
        }


        .loader-text {
            margin-bottom: 20px;

            font-size: 18px;

            letter-spacing: 2px;

            animation: blink 1s infinite;
        }


        .loading-bar {
            width: 260px;
            height: 6px;

            background: #111;

            border-radius: 5px;

            overflow: hidden;
        }


        .loading-progress {
            height: 100%;
            width: 0%;

            background: #00ff41;

            animation: load 3s forwards;
        }


        @keyframes load {

            to {
                width: 100%;
            }

        }


        @keyframes blink {

            50% {
                opacity: 0.5;
            }

        }


        /* ============================= */
        /* MAIN CONTAINER */
        /* ============================= */

        .container {
            padding: 80px 20px;

            position: relative;

            z-index: 2;

            display: none;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;
        }


        /* ============================= */
        /* PROFILE */
        /* ============================= */

        .profile-img {
            width: 150px;
            height: 150px;

            border-radius: 50%;

            border: 3px solid #00ff41;

            box-shadow:
                0 0 20px #00ff41,
                0 0 50px #00ff41;

            margin: 0 auto 25px auto;

            display: block;
        }


        /* ============================= */
        /* GLITCH / SCAN TEXT */
        /* ============================= */

        .glitch {
            position: relative;

            display: inline-block;

            font-size: 42px;

            font-weight: bold;

            color: #00ff41;

            letter-spacing: 2px;

            text-shadow:
                0 0 10px #00ff41,
                0 0 30px #00ff41;

            overflow: hidden;
        }


        .glitch::after {
            content: "";

            position: absolute;

            left: 0;

            width: 100%;
            height: 40%;

            background: linear-gradient(
                to bottom,
                transparent,
                rgba(0,255,65,0.8),
                transparent
            );

            animation: scan 3s linear infinite;

            pointer-events: none;
        }


        @keyframes scan {

            0% {
                top: -50%;
            }

            100% {
                top: 120%;
            }

        }


        /* ============================= */
        /* SUBTITLE */
        /* ============================= */

        .subtitle {
            color: #00ff41;

            margin: 20px 0 40px;

            opacity: 0.8;
        }


        /* ============================= */
        /* BUTTONS */
        /* ============================= */

        .buttons {
            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 15px;

            margin-bottom: 50px;

            max-width: 700px;

            width: 100%;
        }


        .buttons a {
            text-decoration: none;
        }


        .buttons button {
            padding: 12px 25px;

            background: #00ff41;

            border: none;

            border-radius: 6px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            color: black;
        }


        .buttons button:hover {
            transform: scale(1.08);

            box-shadow:
                0 0 20px #00ff41;
        }


        /* ============================= */
        /* SPECIAL "THIS IS FOR YOU" */
        /* ============================= */

        .special-button {
            flex-basis: 100%;

            display: flex;

            justify-content: center;

            margin-top: 5px;
        }


        .special-button button {
            background: #ff1744;

            color: white;

            padding: 12px 30px;

            box-shadow:
                0 0 12px rgba(255,23,68,0.6);
        }


        .special-button button:hover {
            transform: scale(1.08);

            box-shadow:
                0 0 20px #ff1744,
                0 0 40px rgba(255,23,68,0.5);
        }


        /* ============================= */
        /* TERMINAL */
        /* ============================= */

        .terminal {
            background: #000;

            border: 1px solid #00ff41;

            padding: 20px;

            max-width: 650px;

            width: 100%;

            margin: 40px auto;

            text-align: left;

            box-shadow:
                0 0 25px #00ff41;

            min-height: 140px;
        }


        /* ============================= */
        /* MOBILE */
        /* ============================= */

        @media(max-width:600px) {

            .container {
                padding: 70px 15px;
            }


            .profile-img {
                width: 130px;
                height: 130px;
            }


            .glitch {
                font-size: 34px;

            }


            .subtitle {

            .buttons {

            .buttons button {

            }


            .special-button {

            .terminal {

            }


            .terminal {

<body>

    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script>


        /* ============================= */
        /* LOADER CONTROL */
        /* ============================= */

        setTimeout(() => {

            document.getElementById("loader").style.display = "none";

            document.getElementById("mainContent").style.display = "flex";

        }, 3000);



        /* ============================= */
        /* MATRIX RAIN */
        /* ============================= */

        const canvas =
            document.getElementById("matrix");

        const ctx =
            canvas.getContext("2d");


        canvas.height =
            window.innerHeight;

        canvas.width =
            window.innerWidth;


        const letters =
            "アカサタナハマヤラ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";


        const fontSize = 14;


        const columns =
            Math.floor(canvas.width / fontSize);


        const drops = [];


        for(let i = 0; i < columns; i++){

            drops[i] = 1;

        }



        /* ============================= */
        /* MATRIX DRAW */
        /* ============================= */

        function draw(){

            ctx.fillStyle =
                "rgba(0,0,0,0.05)";


            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            ctx.fillStyle =
                "#00ff41";


            ctx.font =
                fontSize + "px monospace";


            for(let i = 0; i < drops.length; i++){

                const text =
                    letters.charAt(
                        Math.floor(
                            Math.random() * letters.length
                        )
                    );


                ctx.fillText(
                    text,
                    i * fontSize,
                    drops[i] * fontSize
                );


                if(
                    drops[i] * fontSize > canvas.height &&
                    Math.random() > 0.975
                ){

                    drops[i] = 0;

                }


                drops[i]++;

            }

        }


        /* Matrix speed */

        setInterval(
            draw,
            33
        );



        /* ============================= */
        /* TERMINAL TYPING */
        /* ============================= */

        const terminal =
            document.getElementById("terminal");


        const lines = [

            "✪═━━━━━━━━━━━━━━━━━━━━━━━━━━━━━═✪",

            "　$ whoami",

            "　气VENØM三ノ乙",

            "",

            "　$ status",

            "　气VENØM三ノ乙 system online...",

            "",

            "　Learning. Building. Evolving.",

            "",

            "",

            "　　　　　Access granted...",

            "✪═━━━━━━━━━━━━━━━━━━━━━━━━━━━━━═✪",

            "",

            "",

            "　　　　　　　　　　　　　Authorised by",

            "　　　　　　　　　　　　　气VENØM三ノ乙"

        ];


        let lineIndex = 0;

        let charIndex = 0;



        /* ============================= */
        /* TYPE EACH LINE */
        /* ============================= */

        function typeLine(){

            if(lineIndex < lines.length){

                if(
                    charIndex <
                    lines[lineIndex].length
                ){

                    terminal.innerHTML +=
                        lines[lineIndex].charAt(charIndex);

                    charIndex++;


                    setTimeout(
                        typeLine,
                        40
                    );

                }

                else{

                    terminal.innerHTML +=
                        "<br>";

                    lineIndex++;

                    charIndex = 0;


                    setTimeout(
                        typeLine,
                        400
                    );

                }

            }

        }



        /* Start terminal after loader */

        setTimeout(
            typeLine,
            3500
        );



        /* ============================= */
        /* RESPONSIVE MATRIX */
        /* ============================= */

        window.addEventListener(
            "resize",
            () => {

                canvas.width =
                    window.innerWidth;

                canvas.height =
                    window.innerHeight;

            }
        );


    </script>
